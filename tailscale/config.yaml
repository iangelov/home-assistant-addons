name: Tailscale
version: "v1.102.1.1"
slug: tailscale-ha
description: "A zero config VPN"
url: "https://github.com/iangelov/home-assistant-addons/tree/main/tailscale"
arch:
  - aarch64
  - amd64
image: "ghcr.io/iangelov/{arch}-app-tailscale"
startup: services
boot: auto
hassio_api: true
host_network: true
privileged:
  - NET_ADMIN
  # Required only to mount a private resolv.conf for tailscaled, preventing
  # its MagicDNS upstream queries from looping through Home Assistant DNS.
  - SYS_ADMIN
devices:
  - "/dev/net/tun"
init: false
options:
  hostname: homeassistant
  advertised_routes: []
  tags: []
  accept_dns: true
  proxy_serve_ha: false
schema:
  auth_key: str
  advertised_routes:
    - str
  advertise_exit_node: bool?
  advertise_connector: bool?
  tags:
    - str
  accept_dns: bool
  port: int(0,65535)?
  hostname: str?
  force_reauth: bool?
  proxy_serve_ha: bool?
  webclient: bool?
